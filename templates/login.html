<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie – Panel Administratora | PYCHA KEBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .login-box {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo img {
            height: 60px;
            margin-bottom: 12px;
        }
        .login-logo h1 {
            color: #fff;
            font-size: 1.6rem;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.5px;
        }
        .login-logo p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: #252525;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: #e85a2a;
            background: #2a2a2a;
            box-shadow: 0 0 0 4px rgba(232,90,42,0.15);
        }
        .login-submit {
            width: 100%;
            padding: 13px;
            background: #e85a2a;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .login-submit:hover {
            background: #c43d15;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(232,90,42,0.35);
        }
        .login-error {
            background: rgba(231,76,60,0.15);
            border: 1px solid rgba(231,76,60,0.4);
            color: #ff7675;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
        }
        .login-back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-back:hover {
            color: #e85a2a;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="login-logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="PYCHA KEBS">
        <h1>Panel Administratora</h1>
        <p>Zarządzanie ofertą i treściami lokalu</p>
    </div>

    {% if error %}
    <div class="login-error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="username">Login</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Wpisz login" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Hasło</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Wpisz hasło" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-submit">Zaloguj się do panelu</button>
    </form>

    <a href="{{ url_for('index') }}" class="login-back">← Wróć do strony głównej</a>
</div>

</body>
</html>
